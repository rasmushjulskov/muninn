name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'rasmushjulskov/muninn'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$version"
      - name: Verify immutable export provenance and bytes
        run: bun scripts/verify-public-export.ts .
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run canonical checks and retain the proven tarball
        env:
          MUNINN_PACK_OUTPUT: ${{ runner.temp }}/release-pack
        run: bun run check
      - name: Publish the proven tarball with npm trusted publishing
        env:
          MUNINN_PACK_OUTPUT: ${{ runner.temp }}/release-pack
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$MUNINN_PACK_OUTPUT"/*.tgz)
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --provenance --access public
